spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:smartai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  flyway:
    locations: classpath:db/migration/common

management:
  health:
    rabbit:
      enabled: false

logging:
  level:
    com.smartai.core: INFO

smartai:
  requirement-drafts:
    encryption-key: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
