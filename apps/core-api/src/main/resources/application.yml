spring:
  application:
    name: core-api
  flyway:
    enabled: true
    locations: classpath:db/migration/common
    clean-disabled: true
    validate-on-migrate: true
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
